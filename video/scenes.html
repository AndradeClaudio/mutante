<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mutante demo</title>
<style>
  html, body { margin: 0; background: #f6f7fb; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="screen" width="1920" height="1080"></canvas>
<script src="soundtrack.js"></script>
<script>
// Demo video drawn from the real data (window.DATA is injected by the recorder).
// Every scene is a function of time, so dropped frames never delay the video.
const W = 1920, H = 1080;
const ctx = document.getElementById('screen').getContext('2d');
// Light theme shared with the public dashboard: soft aurora background, glass panels, violet-to-cyan accents.
const COLOR = {
  background: '#f6f7fb', panel: 'rgba(255,255,255,0.80)', border: 'rgba(15,23,42,0.08)', text: '#0b1020', muted: '#5a6478',
  counted: '#10b5d6', explained: '#f5a524', bad: '#f4546b', good: '#12b981', blue: '#6d5dfc', code: '#0f1222',
  codeText: '#e6e9f5', codeMuted: '#8a93a6', codeAccent: '#a99cff', track: 'rgba(15,23,42,0.07)',
};
// One colour per reviewer, the same as on the dashboard.
const REVIEWER_COLOR = { 'auto-routed': '#6d5dfc', '7310045': '#10b5d6', '5530': '#f4546b', '20260828': '#f5a524' };
const SHORT_NAME = { 'auto-routed': 'ChainSight', '7310045': 'CodeWire', '5530': 'Verity', '20260828': 'PREFLIGHT' };
const SANS = '"Segoe UI", system-ui, sans-serif';
const MONO = '"Cascadia Code", Consolas, monospace';
const ROUND_1 = 'round-001', ROUND_2 = 'round-002', ROUND_3 = 'round-003-auto-routing', STATIC_BASELINE = 'round-002-static-baseline';
// The same samples bought again on later days: day 1 named three miners (round 2) and used auto-routing (round 3).
const DAYS = [['6 Nov', [ROUND_2, ROUND_3]], ['7 Nov', ['round-004']], ['8 Nov', ['round-005']]];
// A one-character bug that the best reviewer explained, the network discarded and the others let through.
const EXAMPLE_CORRECT = 'discount-age-correct', EXAMPLE_MUTANT = 'discount-age-boundary-1';

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const pct = (x) => `${Math.round(x * 100)}%`;

function statistics(D) {
  const reviewerRow = (id, name, mine) => {
    const n = (grade) => mine.filter((p) => p.grade_code === grade).length;
    const planted = mine.filter((p) => p.answer_key === 'planted bug').length;
    const correct = mine.filter((p) => p.answer_key === 'correct code').length;
    const paid = mine.reduce((sum, p) => sum + p.paid_usdc, 0);
    return {
      id, name, planted, paid,
      counted: n('caught') / planted,
      explained: (n('caught') + n('explained-without-verdict')) / planted,
      falseAlarms: correct ? n('false-alarm') / correct : 0,
      costPerCatch: n('caught') ? paid / n('caught') : null,
      discarded: mine.filter((p) => p.answer_key !== 'annulled' && p.verdict_discarded_by_network === 1).length,
    };
  };
  // Round 2 named each miner; round 3 asked the same samples without naming one (auto-routing).
  const round2 = D.purchases.filter((p) => p.round === ROUND_2);
  const round3 = D.purchases.filter((p) => p.round === ROUND_3);
  const direct = [...new Set(round2.map((p) => p.reviewer_id))]
    .map((id) => reviewerRow(id, round2.find((p) => p.reviewer_id === id).reviewer, round2.filter((p) => p.reviewer_id === id)));
  const routedTo = round3[0].served_by.split(' — ')[0];
  const routed = reviewerRow('auto-routed', `${routedTo} (via auto-routing)`, round3);
  const scoreboard = [...direct, routed].sort((a, b) => b.explained - a.explained);
  const bestDirect = [...direct].sort((a, b) => b.explained - a.explained)[0];
  const readers = scoreboard.filter((r) => r.explained > 0.2);
  const cases2 = D.cases.filter((c) => c.round === ROUND_2);
  const round1 = D.purchases.filter((p) => p.round === ROUND_1);
  const routedNames = new Set(round3.map((p) => p.served_by));
  // Why each round-1 miner returned nothing, from what the network answered.
  const miners1 = [...new Set(round1.map((p) => p.reviewer_id))].map((id) => {
    const mine = round1.filter((p) => p.reviewer_id === id);
    const answered = mine.some((p) => p.grade_code !== 'failed');
    const status = answered ? 'answered'
      : routedNames.has(mine[0].reviewer) ? 'routed-only'
      : /could not route/.test(mine[0].answer) ? 'unreachable' : 'data-source';
    return { id, name: mine[0].reviewer, status };
  });
  const count1 = (status) => miners1.filter((m) => m.status === status).length;
  // Each reviewer on each day it was measured.
  const days = DAYS.map(([day, rounds]) => {
    const today = D.purchases.filter((p) => rounds.includes(p.round));
    const rows = Object.keys(SHORT_NAME).filter((id) => today.some((p) => p.reviewer_id === id))
      .map((id) => reviewerRow(id, SHORT_NAME[id], today.filter((p) => p.reviewer_id === id)));
    return { day, rows, purchases: today.length };
  }).filter((d) => d.rows.length > 0);
  const latest = days[days.length - 1];
  const across = (id, key) => days.map((d) => d.rows.find((r) => r.id === id)?.[key]).filter((v) => v !== undefined && v !== null);
  const officialEpoch = Math.max(...D.official.map((r) => r.epoch));
  const official = D.official.filter((r) => r.epoch === officialEpoch);
  // Static analyzers: any warning counts as flagging the bug (a generous reading).
  const baseline = D.purchases.filter((p) => p.round === STATIC_BASELINE && p.answer_key === 'planted bug');
  const isFlag = (p) => p.grade_code === 'caught' || p.grade_code === 'blocked-without-reason';
  const linters = [...new Set(baseline.map((p) => p.reviewer_id))].map((id) => {
    const mine = baseline.filter((p) => p.reviewer_id === id);
    return { name: mine[0].reviewer, flagged: mine.filter(isFlag).length, planted: mine.length };
  });
  const linterHits = [...new Set(baseline.filter(isFlag).map((p) => p.case))]
    .map((id) => D.cases.find((c) => c.round === STATIC_BASELINE && c.case === id));
  return {
    days, latest, across, officialEpoch, official, tiedAtTop: official[0].tied_at_top,
    linters, linterHits,
    scoreboard, readers, bestDirect, routed,
    othersMax: Math.max(...scoreboard.filter((r) => !readers.includes(r)).map((p) => p.explained)),
    discardedTotal: readers.reduce((sum, r) => sum + r.discarded, 0),
    byPrice: scoreboard.filter((r) => r.costPerCatch !== null).sort((a, b) => a.costPerCatch - b.costPerCatch),
    purchases: round2.length, routedPurchases: round3.length, price: round2[0].paid_usdc,
    originals: cases2.filter((c) => c.case.endsWith('-correct')).length,
    operators: new Set(cases2.filter((c) => c.answer_key !== 'correct code' && c.mutation).map((c) => c.mutation)).size,
    totalCases: cases2.length,
    planted: cases2.filter((c) => c.answer_key === 'planted bug').length,
    correct: cases2.filter((c) => c.answer_key === 'correct code').length,
    annulled: cases2.filter((c) => c.answer_key === 'annulled').length,
    miners1, answered1: count1('answered'), dataSources1: count1('data-source'), unreachable1: count1('unreachable'),
    falseAlarmsMax: Math.max(...scoreboard.map((p) => p.falseAlarms)),
  };
}

// ---------- drawing ----------
function box(x, y, w, h, fill = COLOR.panel, border = COLOR.border, radius = 24) {
  ctx.save();
  // Glass panels float on a soft shadow; coloured or dark boxes sit flatter.
  if (fill === COLOR.panel || fill === COLOR.code) {
    ctx.shadowColor = 'rgba(30, 27, 75, 0.14)'; ctx.shadowBlur = 48; ctx.shadowOffsetY = 18;
  }
  ctx.beginPath(); ctx.roundRect(x, y, w, h, radius); ctx.fillStyle = fill; ctx.fill();
  ctx.restore();
  if (border) { ctx.beginPath(); ctx.roundRect(x, y, w, h, radius); ctx.strokeStyle = border; ctx.lineWidth = 2; ctx.stroke(); }
}
// The brand gradient, left to right across a span.
function gradient(x0, x1) {
  const g = ctx.createLinearGradient(x0, 0, x1, 0);
  g.addColorStop(0, '#6d5dfc'); g.addColorStop(0.5, '#3b82f6'); g.addColorStop(1, '#10b5d6');
  return g;
}
// Slowly drifting colour fields behind every scene; a function of the global time so they never jump.
function backdrop(T) {
  ctx.fillStyle = COLOR.background; ctx.fillRect(0, 0, W, H);
  const blobs = [
    [300 + 160 * Math.sin(T / 9), 120 + 90 * Math.cos(T / 11), 760, '201, 194, 255'],
    [1650 + 140 * Math.cos(T / 10), 260 + 110 * Math.sin(T / 8), 680, '182, 236, 247'],
    [1000 + 220 * Math.sin(T / 13), 980 + 60 * Math.cos(T / 7), 620, '255, 217, 225'],
  ];
  for (const [x, y, r, rgb] of blobs) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${rgb}, 0.75)`); g.addColorStop(1, `rgba(${rgb}, 0)`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
}

// ---------- 3D columns ----------
// A tiny painter's-algorithm renderer: each column is a box on the floor, the camera orbits around the vertical axis.
function columns3d(items, { cx, cy, scale = 1, angle = 0, tilt = 0.42, grid = null, distance = 2400 }) {
  const cosA = Math.cos(angle), sinA = Math.sin(angle), cosT = Math.cos(tilt), sinT = Math.sin(tilt);
  const project = ([x, y, z]) => {
    const xr = x * cosA - z * sinA, zr = x * sinA + z * cosA;
    const yr = y * cosT - zr * sinT, zt = y * sinT + zr * cosT;
    const f = distance / (distance + zt);
    return { x: cx + xr * f * scale, y: cy - yr * f * scale, depth: zt };
  };
  if (grid) {
    ctx.save(); ctx.strokeStyle = 'rgba(15,23,42,0.10)'; ctx.lineWidth = 1.5;
    for (let v = -grid.size; v <= grid.size; v += grid.step) {
      for (const [a, b] of [[[v, 0, -grid.size], [v, 0, grid.size]], [[-grid.size, 0, v], [grid.size, 0, v]]]) {
        const p = project(a), q = project(b);
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
      }
    }
    ctx.restore();
  }
  // Boxes never intersect, so drawing whole boxes far-to-near (and each box's faces far-to-near) is exact.
  const boxes = [];
  for (const it of items) {
    const faces = [];
    const s = it.size / 2, h = Math.max(2, it.height);
    const v = (dx, y, dz) => [it.x + dx * s, y, it.z + dz * s];
    const quads = [
      { pts: [v(-1, h, -1), v(1, h, -1), v(1, h, 1), v(-1, h, 1)], light: 1.18 },
      { pts: [v(-1, 0, 1), v(1, 0, 1), v(1, h, 1), v(-1, h, 1)], light: 1.0 },
      { pts: [v(-1, 0, -1), v(1, 0, -1), v(1, h, -1), v(-1, h, -1)], light: 1.0 },
      { pts: [v(1, 0, -1), v(1, 0, 1), v(1, h, 1), v(1, h, -1)], light: 0.78 },
      { pts: [v(-1, 0, -1), v(-1, 0, 1), v(-1, h, 1), v(-1, h, -1)], light: 0.78 },
    ];
    for (const quad of quads) {
      const p = quad.pts.map(project);
      faces.push({ p, depth: p.reduce((sum, q) => sum + q.depth, 0) / 4, color: it.color, light: quad.light });
    }
    it.top = project([it.x, h, it.z]);
    faces.sort((a, b) => b.depth - a.depth);
    boxes.push({ depth: project([it.x, h / 2, it.z]).depth, faces });
  }
  boxes.sort((a, b) => b.depth - a.depth);
  for (const f of boxes.flatMap((b) => b.faces)) {
    const c = shade(f.color, f.light);
    ctx.beginPath(); f.p.forEach((q, i) => (i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y))); ctx.closePath();
    ctx.fillStyle = c; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1; ctx.stroke();
  }
  return items;
}
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const ch = (v) => Math.max(0, Math.min(255, Math.round(k >= 1 ? v + (255 - v) * (k - 1) * 1.6 : v * k)));
  return `rgb(${ch(n >> 16)}, ${ch((n >> 8) & 255)}, ${ch(n & 255)})`;
}
function text(t, x, y, { size = 36, color = COLOR.text, weight = 400, font = SANS, align = 'left' } = {}) {
  ctx.font = `${weight} ${size}px ${font}`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  ctx.fillText(t, x, y);
}
function wrap(t, width, size, weight = 400, font = SANS) {
  ctx.font = `${weight} ${size}px ${font}`;
  const lines = []; let current = '';
  for (const word of t.split(/\s+/)) {
    const attempt = current ? `${current} ${word}` : word;
    if (ctx.measureText(attempt).width > width && current) { lines.push(current); current = word; } else current = attempt;
  }
  if (current) lines.push(current);
  return lines;
}
function paragraph(t, x, y, width, options = {}) {
  const size = options.size ?? 36, spacing = options.spacing ?? size * 1.35;
  const lines = wrap(t, width, size, options.weight, options.font);
  lines.forEach((l, i) => text(l, x, y + i * spacing, options));
  return y + lines.length * spacing;
}
function codeBlock(lines, x, y, { size = 30, highlight = -1, highlightColor = COLOR.bad, width = 1100 } = {}) {
  const lineHeight = size * 1.55;
  box(x, y, width, lines.length * lineHeight + 48, COLOR.code);
  lines.forEach((l, i) => {
    const ly = y + 24 + i * lineHeight;
    if (i === highlight) { ctx.fillStyle = highlightColor + '33'; ctx.fillRect(x + 2, ly, width - 4, lineHeight); }
    text(l, x + 28, ly + size * 1.1, { size, font: MONO, color: l.trim().startsWith('//') ? COLOR.codeMuted : COLOR.codeText });
  });
  return y + lines.length * lineHeight + 48;
}
function pill(t, x, y, color, size = 24) {
  ctx.font = `600 ${size}px ${SANS}`;
  const w = ctx.measureText(t).width + size * 1.2, h = size * 1.6;
  box(x, y - h + size * 0.45, w, h, color + '22', color, h / 2);
  text(t, x + size * 0.6, y, { size, color, weight: 600 });
  return w;
}
function heading(t, subtitle) {
  ctx.fillStyle = gradient(120, 220); ctx.beginPath(); ctx.roundRect(120, 96, 64, 8, 4); ctx.fill();
  ctx.save(); ctx.letterSpacing = '-1.5px';
  text(t, 120, 180, { size: 66, weight: 700 });
  ctx.restore();
  if (subtitle) text(subtitle, 120, 232, { size: 29, color: COLOR.muted });
}

// ---------- scenes ----------
function scenes(D, S) {
  const caseById = (id) => D.cases.find((c) => c.round === ROUND_2 && c.case === id);
  const correct = caseById(EXAMPLE_CORRECT).code.trimEnd().split('\n');
  const mutant = caseById(EXAMPLE_MUTANT).code.trimEnd().split('\n');
  const changedLine = mutant.findIndex((l, i) => l !== correct[i]);
  const example = D.purchases.filter((p) => p.round === ROUND_2 && p.case === EXAMPLE_MUTANT);
  const fromBest = example.find((p) => p.reviewer_id === S.bestDirect.id);
  const log = D.log;
  const sampleMutants = ['can-vote-boundary-1', 'cart-total-arithmetic-1', 'weekend-logical-connective-1', 'find-user-sql-concatenation-1', 'strong-password-constant-changed-1']
    .map(caseById).filter(Boolean);

  return [
    { duration: 9, captions: [[0.5, 8.5, 'Who reviews the reviewers? A crash test for the code-review miners on Telegraph.']],
      draw(t) {
        ctx.globalAlpha *= easeOut(t / 1.2);
        ctx.save(); ctx.letterSpacing = '-4px';
        text('MUTANTE', W / 2, 330, { size: 150, weight: 800, align: 'center', color: gradient(W / 2 - 420, W / 2 + 420) });
        ctx.restore();
        text('a crash test for Telegraph code-review miners', W / 2, 410, { size: 46, align: 'center', weight: 500 });
        text('Telegraph Hackathon Season II  ·  Apps & Agents  ·  Model Economy', W / 2, 470, { size: 28, align: 'center', color: COLOR.muted });
        const rows = S.latest.rows;
        columns3d(rows.map((r, i) => ({ x: (i - (rows.length - 1) / 2) * 150, z: 0, size: 90, height: 420 * r.explained * easeOut((t - 1) / 2.5), color: REVIEWER_COLOR[r.id] })),
          { cx: W / 2, cy: 840, scale: 0.8, angle: 0.32 * Math.sin(t / 2.2), tilt: 0.3, grid: { size: 450, step: 75 } });
      } },

    { duration: 21, sounds: [[8.5, 'glitch']], captions: [
        [0.5, 8, 'This function decides who gets a discount: seniors from 65, and children under 12.'],
        [8.5, 20.5, 'Change one character and a customer on their 65th birthday loses the senior discount. Would a paid AI reviewer notice?']],
      draw(t) {
        heading('A one-character bug', 'Real sample from the test set');
        const swapped = t > 8.5;
        codeBlock(swapped ? mutant : correct, 120, 290, { size: 34, highlight: swapped ? changedLine : -1, width: 1680 });
        if (swapped) {
          ctx.globalAlpha *= easeOut((t - 8.5) / 0.6);
          pill('mutant: ">=" became ">"', 120, 640, COLOR.bad, 30);
          text('hasDiscount(65)  →  false   (the comment promises true)', 120, 720, { size: 32, font: MONO, color: COLOR.muted });
        }
      } },

    { duration: 24, captions: [
        [0.5, 11, 'We start from small correct functions. Each states its rule in a comment and has tests.'],
        [11.5, 23.5, 'A mutation engine plants one bug at a time, and keeps it only if the tests prove it is a real bug.']],
      draw(t) {
        heading('How the test set is built', 'Every planted bug is proven by running tests, so the answer key is known before we ask');
        const steps = [
          [`${S.originals}`, 'correct functions', 'contract in a comment, plus tests'],
          [`${S.operators}`, 'kinds of mutation', 'flipped comparison, changed constant, removed guard, SQL concatenation…'],
          ['sandbox', 'tests per mutant', 'kept only if it breaks the contract'],
          [`${S.totalCases}`, 'test cases', `${S.planted} proven bugs · ${S.correct} correct · ${S.annulled} annulled after review`],
        ];
        const w = 390, gap = 40, y = 300;
        steps.forEach(([number, label, note], i) => {
          const a = easeOut((t - 1 - i * 2.5) / 0.8);
          if (a <= 0) return;
          ctx.save(); ctx.globalAlpha *= a;
          const x = 120 + i * (w + gap);
          box(x, y, w, 300);
          text(number, x + 30, y + 110, { size: number.length > 4 ? 60 : 88, weight: 700, color: i === 3 ? COLOR.counted : COLOR.text });
          text(label, x + 30, y + 165, { size: 32, weight: 600 });
          paragraph(note, x + 30, y + 215, w - 60, { size: 24, color: COLOR.muted });
          if (i < 3) text('→', x + w + 6, y + 165, { size: 36, color: COLOR.muted });
          ctx.restore();
        });
        if (t > 11.5) {
          const step = Math.floor((t - 11.5) / 2.4);
          const c = sampleMutants[step % sampleMutants.length];
          ctx.save(); ctx.globalAlpha *= easeOut((t - 11.5 - step * 2.4) / 0.5);
          text('Mutant', 120, 700, { size: 26, color: COLOR.muted });
          text(c.case, 230, 700, { size: 26, font: MONO, color: COLOR.blue });
          text(c.planted.replaceAll('`', ''), 120, 760, { size: 40, font: MONO, color: COLOR.bad });
          ctx.restore();
        }
      } },

    { duration: 28, sounds: [[1, 'pulse']], captions: [
        [0.5, 13, `Then an agent buys a review of every sample from every reviewer: machine to machine, $${S.price.toFixed(2)} per call in test USDC.`],
        [13.5, 27.5, 'What you see is a replay of the real run log from 6 November 2026.']],
      draw(t) {
        heading('Buying the reviews', 'Replay of the real run log  ·  Ethereum Sepolia testnet  ·  x402 payments');
        const visible = Math.min(log.length, Math.floor(clamp((t - 1) / 25) * log.length));
        box(120, 280, 1180, 570, COLOR.code);
        log.slice(Math.max(0, visible - 14), visible).forEach((l, i) => {
          const y = 330 + i * 38;
          text(`[${String(l.left).padStart(3)} left]`, 150, y, { size: 24, font: MONO, color: COLOR.codeMuted });
          text(l.reviewer.padEnd(9), 330, y, { size: 24, font: MONO, color: COLOR.codeAccent });
          text(l.caseId.slice(0, 38), 470, y, { size: 24, font: MONO, color: COLOR.codeText });
          const color = l.outcome === 'Request changes' ? COLOR.counted : l.outcome === 'no verdict' ? COLOR.explained : COLOR.codeMuted;
          text(l.outcome, 1270, y, { size: 24, font: MONO, color, align: 'right' });
        });
        box(1360, 280, 440, 330);
        text('reviews bought', 1400, 340, { size: 28, color: COLOR.muted });
        text(String(visible), 1400, 430, { size: 88, weight: 700 });
        text('test USDC paid', 1400, 500, { size: 28, color: COLOR.muted });
        text(`$${(visible * S.price).toFixed(2)}`, 1400, 580, { size: 64, weight: 700, color: gradient(1400, 1640) });
        box(1360, 640, 440, 210);
        paragraph('No human in the loop: the agent pays each miner per call and stores every answer and receipt.', 1400, 700, 370, { size: 28, color: COLOR.muted });
      } },

    { duration: 16, captions: [[0.5, 15.5, 'Every answer comes with a Telegraph receipt and an on-chain payment anyone can check.']],
      draw(t) {
        heading('Proof of every purchase', 'Receipt header returned by the Telegraph node, and its payment on Sepolia');
        const lines = [
          'X-TELEGRAPH-RECEIPT',
          '{',
          `  "receipt_hash": "${fromBest.receipt.slice(0, 34)}…",`,
          `  "reviewer":     "${fromBest.reviewer_id}",`,
          `  "amount":       "${fromBest.paid_usdc.toFixed(2)} USDC",`,
          `  "tx_hash":      "${fromBest.tx.slice(0, 34)}…"`,
          '}',
        ];
        codeBlock(lines, 120, 290, { size: 32, width: 1680 });
        if (t > 6) {
          ctx.globalAlpha *= easeOut((t - 6) / 0.8);
          text('sepolia.etherscan.io/tx/', 120, 790, { size: 34, font: MONO, color: COLOR.muted });
          text(fromBest.tx, 120, 845, { size: 30, font: MONO, color: COLOR.blue });
        }
      } },

    { duration: 16, captions: [
        [0.5, 7.5, `First, the free option. ESLint and SonarJS flagged ${S.linters[0].flagged} of the ${S.linters[0].planted} bugs, even counting any warning.`],
        [8, 15.5, `The other ${S.linters[0].planted - S.linters[0].flagged} are valid code that breaks its own comment. No lint rule knows what the code promises.`]],
      draw(t) {
        heading('First, the free option: linters', 'ESLint and SonarJS on the same samples, run locally  ·  any warning counts as a find');
        S.linters.forEach((l, i) => {
          const y = 330 + i * 120;
          const share = l.flagged / l.planted;
          const v = share * easeOut((t - 1 - i * 0.4) / 1.2);
          text(l.name, 120, y + 34, { size: 30, weight: 600 });
          ctx.fillStyle = COLOR.track; ctx.fillRect(760, y, 960, 46);
          ctx.fillStyle = COLOR.muted; ctx.fillRect(760, y, Math.max(4, v * 960), 46);
          if (t > 1) text(`${pct(v)}  (${l.flagged} of ${l.planted})`, 760 + Math.max(4, v * 960) + 16, y + 34, { size: 28 });
        });
        if (t > 4) {
          ctx.save(); ctx.globalAlpha *= easeOut((t - 4) / 0.8);
          text('What they flagged', 120, 620, { size: 28, color: COLOR.muted });
          S.linterHits.forEach((c, i) => {
            text(c.case, 120, 665 + i * 72, { size: 22, font: MONO, color: COLOR.blue });
            text(c.planted.replaceAll('`', ''), 120, 697 + i * 72, { size: 24, font: MONO });
          });
          ctx.restore();
        }
        if (t > 8) {
          ctx.save(); ctx.globalAlpha *= easeOut((t - 8) / 0.8);
          text('What they missed, among others', 1000, 620, { size: 28, color: COLOR.muted });
          text(caseById(EXAMPLE_MUTANT).planted.replaceAll('`', ''), 1000, 670, { size: 28, font: MONO, color: COLOR.bad });
          text('code is valid; only the comment says it is wrong', 1000, 714, { size: 24, color: COLOR.muted });
          ctx.restore();
        }
      } },

    // The climax: the discarded-verdicts badge lands at 12.5 s, on the impact.
    { duration: 36, sounds: [[12.5, 'impact']], captions: [
        [0.5, 12, `Results. ${S.readers.length} reviewers really read the code: ${S.readers.map((r) => `${SHORT_NAME[r.id] ?? r.name.split(' ')[0]} explained ${pct(r.explained)}`).join(', ')} of the planted bugs.`],
        [12.5, 24, `But the network counted only ${S.readers.map((r) => pct(r.counted)).join(' and ')}: both write their verdict as prose, so the verdict field was rejected ${S.discardedTotal} times.`],
        [24.5, 35.5, `The other miners caught at most ${pct(S.othersMax)}, only the SQL injection. False alarms on correct code: at most ${pct(S.falseAlarmsMax)}.`]],
      draw(t) {
        heading('Scoreboard', `Same ${S.planted} planted bugs and ${S.correct} correct samples  ·  ${S.purchases} reviews naming a miner, ${S.routedPurchases} via auto-routing`);
        const x0 = 700, width = 1020;
        S.scoreboard.forEach((r, i) => {
          const y = 300 + i * 140;
          paragraph(r.name, 120, y + 28, 540, { size: 28, weight: 600, spacing: 34 });
          [['explained', 'explained the bug in its answer', COLOR.explained], ['counted', 'counted by the network', COLOR.counted]].forEach(([key, label, color], j) => {
            const from = j === 0 ? 1 : 12.5;
            const v = r[key] * easeOut((t - from - i * 0.4) / 1.5);
            const by = y + j * 56;
            ctx.fillStyle = COLOR.track; ctx.fillRect(x0, by, width, 40);
            ctx.fillStyle = color; ctx.fillRect(x0, by, Math.max(4, v * width), 40);
            if (t > from) text(`${pct(v)}  ${label}`, x0 + Math.max(4, v * width) + 16, by + 30, { size: 24 });
          });
        });
        if (t > 12.5) {
          ctx.globalAlpha *= easeOut((t - 12.5) / 1);
          pill(`${S.discardedTotal} verdicts rejected for their format`, 1060, 165, COLOR.bad, 30);
        }
      } },

    { duration: 16, captions: [
        [0.5, 8, `Same price per call: $${S.price.toFixed(2)}. Per bug caught: ${S.byPrice.map((r) => `${SHORT_NAME[r.id] ?? r.name.split(' ')[0]} $${r.costPerCatch.toFixed(3)}`).join(', ')}.`],
        [8.5, 15.5, 'That is the leaderboard buyers need: price per verified correct answer, not per call.']],
      draw(t) {
        heading('Price per verified correct answer', 'Everything paid to each reviewer ÷ bugs it caught and the network counted');
        const most = Math.max(...S.byPrice.map((r) => r.costPerCatch));
        S.byPrice.forEach((r, i) => {
          const y = 300 + i * 120;
          const v = r.costPerCatch / most * easeOut((t - 1 - i * 0.5) / 1.2);
          paragraph(r.name, 120, y + 30, 540, { size: 28, weight: 600, spacing: 34 });
          ctx.fillStyle = COLOR.track; ctx.fillRect(700, y, 1020, 50);
          ctx.fillStyle = S.readers.includes(r) ? COLOR.counted : COLOR.bad; ctx.fillRect(700, y, Math.max(4, v * 1020), 50);
          const label = `$${r.costPerCatch.toFixed(3)} per bug caught  ·  $${r.paid.toFixed(2)} paid`;
          // A long bar holds its label inside; a short one gets it alongside.
          const inside = v > 0.5;
          if (t > 1.2 + i * 0.5) text(label, inside ? 724 : 700 + Math.max(4, v * 1020) + 18, y + 36, { size: 28, weight: inside ? 600 : 400, color: inside ? '#ffffff' : COLOR.text });
        });
        if (t > 8.5) {
          ctx.save(); ctx.globalAlpha *= easeOut((t - 8.5) / 0.8);
          const spread = S.byPrice[S.byPrice.length - 1].costPerCatch / S.byPrice[0].costPerCatch;
          pill(`${Math.round(spread)}× apart per correct answer, at the same price per call`, 120, 820, COLOR.counted, 30);
          ctx.restore();
        }
      } },

    { duration: 16, captions: [
        [0.5, 7.5, `Telegraph's own leaderboard gives ${S.tiedAtTop} code reviewers the same top score: 1.0.`],
        [8, 15.5, `On the same samples on ${S.latest.day}, those reviewers explained between ${pct(Math.min(...S.latest.rows.map((r) => r.explained)))} and ${pct(Math.max(...S.latest.rows.map((r) => r.explained)))} of the planted bugs.`]],
      draw(t) {
        heading('The official score is a tie', `Telegraph leaderboard for CODE_REVIEW_GENERAL, epoch ${S.officialEpoch}  ·  Mutante measurement on ${S.latest.day}`);
        const rows = [...S.latest.rows].sort((a, b) => b.explained - a.explained);
        rows.forEach((r, i) => {
          const a = easeOut((t - 0.5 - i * 0.35) / 0.7);
          if (a <= 0) return;
          ctx.save(); ctx.globalAlpha *= a;
          const y = 285 + i * 140;
          box(120, y, 1680, 120);
          ctx.fillStyle = REVIEWER_COLOR[r.id]; ctx.beginPath(); ctx.arc(170, y + 62, 14, 0, Math.PI * 2); ctx.fill();
          text(r.name, 205, y + 74, { size: 36, weight: 700 });
          const score = S.official.find((o) => o.reviewer_id === r.id)?.score;
          pill(`official score ${score === undefined ? '—' : score.toFixed(1)}`, 520, y + 74, COLOR.muted, 26);
          const v = r.explained * easeOut((t - 8 - i * 0.3) / 1.4);
          ctx.fillStyle = COLOR.track; ctx.beginPath(); ctx.roundRect(880, y + 44, 560, 36, 18); ctx.fill();
          if (t > 8) {
            ctx.fillStyle = REVIEWER_COLOR[r.id]; ctx.beginPath(); ctx.roundRect(880, y + 44, Math.max(36, v * 560), 36, 18); ctx.fill();
            text(`${pct(v)} explained`, 1470, y + 60, { size: 28, weight: 700 });
            text(r.costPerCatch === null ? 'no bug caught' : '$' + `${r.costPerCatch.toFixed(3)} per bug caught`, 1470, y + 96, { size: 22, color: COLOR.muted });
          }
          ctx.restore();
        });
      } },

    { duration: 26, sounds: [[9, 'impact']], captions: [
        [0.5, 8.5, `We bought the same ${S.latest.purchases} reviews again on ${S.days.slice(1).map((d) => d.day).join(' and ')}: same samples, same answer key.`],
        [9, 17.5, `ChainSight went from ${pct(S.across('auto-routed', 'explained')[0])} to ${pct(S.across('auto-routed', 'explained').at(-1))} of bugs explained. CodeWire's counted share swung between ${pct(Math.min(...S.across('7310045', 'counted')))} and ${pct(Math.max(...S.across('7310045', 'counted')))}.`],
        [18, 25.5, `Verity and PREFLIGHT stayed at ${pct(S.across('5530', 'explained').at(-1))}. One measurement is not enough to rank a reviewer, and a re-run costs cents.`]],
      draw(t) {
        heading('Three days, same samples', 'Column height = share of planted bugs explained  ·  one row per day, rotating');
        const ids = Object.keys(SHORT_NAME);
        const items = [];
        S.days.forEach((d, j) => ids.forEach((id, i) => {
          const r = d.rows.find((x) => x.id === id);
          if (!r) return;
          const grow = easeOut((t - 0.6 - j * 1.4 - i * 0.15) / 1.6);
          items.push({ x: (i - 1.5) * 160, z: (j - (S.days.length - 1) / 2) * 230, size: 92, height: 520 * r.explained * grow, color: REVIEWER_COLOR[id], label: pct(r.explained), grow });
        }));
        columns3d(items, { cx: 640, cy: 720, scale: 0.72, angle: -0.62 + 0.18 * Math.sin(t / 4), tilt: 0.5, grid: { size: 420, step: 70 } });
        for (const it of items) if (it.grow > 0.95 && t > 3) {
          ctx.save(); ctx.font = `700 22px ${SANS}`; ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineJoin = 'round'; ctx.textAlign = 'center';
          ctx.strokeText(it.label, it.top.x, it.top.y - 14); ctx.restore();
          text(it.label, it.top.x, it.top.y - 14, { size: 22, weight: 700, align: 'center' });
        }
        box(1200, 300, 600, 560);
        text('Bugs explained', 1240, 360, { size: 26, color: COLOR.muted });
        text(S.days.map((d) => d.day).join('   →   '), 1240, 400, { size: 22, color: COLOR.muted });
        ids.forEach((id, i) => {
          const y = 470 + i * 100;
          ctx.fillStyle = REVIEWER_COLOR[id]; ctx.beginPath(); ctx.roundRect(1240, y - 24, 22, 22, 6); ctx.fill();
          text(SHORT_NAME[id], 1278, y - 4, { size: 30, weight: 700 });
          text(S.across(id, 'explained').map(pct).join('  →  '), 1240, y + 36, { size: 28, font: MONO, color: COLOR.text });
        });
      } },

    { duration: 24, sounds: [[1.5, 'ping'], [4.5, 'ping'], [7.5, 'ping']], captions: [
        [0.5, 10.5, 'Same bug, three reviewers.'],
        [11, 23.5, `${S.bestDirect.name.split(' ')[0]} found it, but its verdict was rejected for its format. The other two let the bug through.`]],
      draw(t) {
        heading('Same bug, three reviewers', `${EXAMPLE_MUTANT}: a customer who is exactly 65 gets no discount`);
        codeBlock(mutant, 120, 290, { size: 22, highlight: changedLine, width: 780 });
        example.forEach((p, i) => {
          const a = easeOut((t - 1.5 - i * 3) / 0.8);
          if (a <= 0) return;
          ctx.save(); ctx.globalAlpha *= a;
          const y = 290 + i * 195;
          box(940, y, 860, 180);
          text(p.reviewer, 970, y + 46, { size: 28, weight: 600 });
          const verdict = p.verdict === 'none' ? 'verdict rejected by the network' : `verdict: ${p.verdict}`;
          const color = p.grade_code === 'explained-without-verdict' ? COLOR.explained : p.grade_code === 'caught' ? COLOR.counted : COLOR.bad;
          pill(verdict, 970, y + 92, color, 22);
          // Long enough to keep the reviewer's key sentence (where it names the changed expression).
          const quote = p.answer.length > 150 ? `${p.answer.slice(0, 150).replace(/\s+\S*$/, '')}…` : p.answer;
          paragraph(`“${quote}”`, 970, y + 128, 810, { size: 21, color: COLOR.muted, spacing: 26 });
          ctx.restore();
        });
      } },

    { duration: 16, captions: [
        [0.5, 7.5, `Called directly, only ${S.answered1} of the ${S.miners1.length} miners listed for code review returned a review.`],
        [8, 15.5, `Of the rest, ${S.dataSources1} are repository data sources, not reviewers, and ${S.unreachable1} could not be reached. One good reviewer only answers through the router.`]],
      draw(t) {
        heading('Round 1: who can review code at all', 'Every miner listed for CODE_REVIEW_GENERAL on the testnet, called directly');
        const look = {
          answered: ['returned reviews', COLOR.counted],
          'routed-only': ['answers only via auto-routing', COLOR.explained],
          unreachable: ['unreachable: could not route', COLOR.muted],
          'data-source': ['repository data source', COLOR.muted],
        };
        S.miners1.forEach((m, i) => {
          const a = easeOut((t - 0.5 - i * 0.25) / 0.6);
          if (a <= 0) return;
          ctx.save(); ctx.globalAlpha *= a;
          const column = i % 4, row = Math.floor(i / 4);
          const x = 120 + column * 425, y = 280 + row * 140;
          const [label, color] = look[m.status];
          const lit = m.status === 'answered' || m.status === 'routed-only';
          box(x, y, 395, 122, lit ? color + '22' : COLOR.panel, lit ? color : COLOR.border);
          paragraph(m.name, x + 24, y + 40, 350, { size: 22, spacing: 28, weight: 600, color: lit ? COLOR.text : COLOR.muted });
          text(label, x + 24, y + 106, { size: 20, color });
          ctx.restore();
        });
      } },

    { duration: 18, captions: [
        [0.5, 9, 'Bring your own function: Mutante plants bugs in it, proves them with your tests, and buys the reviews.'],
        [9.5, 17.5, 'Failed miners are recorded as failures, and an interrupted run resumes without paying twice.']],
      draw(t) {
        heading('Run it, break it, reproduce it');
        const commands = [
          'npm run try -- --code my-function.js --tests my-function.tests.js',
          'npm run crash-test -- --round my-run --budget 3',
          'npm run scoreboard -- my-run',
        ];
        codeBlock(commands.map((c) => `$ ${c}`), 120, 260, { size: 32, width: 1680 });
        const items = [
          ['Miner offline or refused?', 'Recorded as "could not answer". The run goes on.'],
          ['Run interrupted?', 'Saved after every purchase. Resuming skips what was already paid.'],
          ['Over budget?', 'The agent stops before spending past the limit you set.'],
        ];
        items.forEach(([question, answer], i) => {
          const a = easeOut((t - 2 - i * 3) / 0.8);
          if (a <= 0) return;
          ctx.save(); ctx.globalAlpha *= a;
          text(question, 120, 540 + i * 120, { size: 36, weight: 600 });
          text(answer, 120, 588 + i * 120, { size: 30, color: COLOR.muted });
          ctx.restore();
        });
      } },

    { duration: 15, sounds: [[0, 'resolve']], captions: [[0.5, 14.5, 'Buyers of intelligence need to know what they are buying. Mutante measures it.']],
      draw(t) {
        ctx.globalAlpha *= easeOut(t / 1);
        ctx.save(); ctx.letterSpacing = '-3px';
        text('MUTANTE', W / 2, 380, { size: 130, weight: 800, align: 'center', color: gradient(W / 2 - 380, W / 2 + 380) });
        ctx.restore();
        text('Same score. Different reviewers. Measured every day.', W / 2, 470, { size: 44, align: 'center', weight: 600 });
        text('Telegraph Hackathon Season II entry  ·  @andradeclaudiox  ·  built with Claude', W / 2, 600, { size: 30, align: 'center', color: COLOR.muted });
        text('Source code, run logs and every receipt:', W / 2, 670, { size: 28, align: 'center', color: COLOR.muted });
        text('github.com/AndradeClaudio/mutante', W / 2, 725, { size: 36, font: MONO, align: 'center', color: COLOR.blue });
      } },
  ];
}

function caption(t) {
  const lines = wrap(t, 1500, 40, 500);
  const lineHeight = 54, h = lines.length * lineHeight + 30;
  const y = H - 60 - h;
  ctx.fillStyle = 'rgba(11,16,32,0.86)';
  ctx.beginPath(); ctx.roundRect(W / 2 - 800, y, 1600, h, 12); ctx.fill();
  lines.forEach((l, i) => text(l, W / 2, y + 15 + 40 + i * lineHeight, { size: 40, weight: 500, align: 'center', color: '#ffffff' }));
}

window.prepare = () => {
  const S = statistics(window.DATA);
  const list = scenes(window.DATA, S);
  let start = 0;
  for (const s of list) { s.start = start; start += s.duration; }
  window.CAPTIONS = list.flatMap((s) => s.captions.map(([a, b, words]) => ({ start: s.start + a, end: s.start + b, text: words })));
  window.SOUND_CUES = list.flatMap((s) => (s.sounds ?? []).map(([at, kind]) => ({ at: s.start + at, kind })));
  window.frame = (t) => {
    ctx.globalAlpha = 1; backdrop(t);
    const scene = list.find((s) => t >= s.start && t < s.start + s.duration) ?? list[list.length - 1];
    const local = t - scene.start;
    ctx.save();
    ctx.globalAlpha = clamp(Math.min(local / 0.4, (scene.duration - local) / 0.4));
    scene.draw(local);
    ctx.restore();
    ctx.globalAlpha = 1;
    const current = window.CAPTIONS.find((c) => t >= c.start && t < c.end);
    if (current) caption(current.text);
  };
  return { duration: start, captions: window.CAPTIONS, soundCues: window.SOUND_CUES };
};
</script>
